<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Montserrat,sans-serif;
}

body{

background:transparent;

}

.barra{

background:linear-gradient(90deg,#8e0000,#a40000,#7b0000);

padding:18px 35px;

display:flex;

align-items:center;

justify-content:center;

gap:45px;

color:white;

flex-wrap:wrap;

}

.titulo{

display:flex;

align-items:center;

gap:15px;

font-weight:700;

font-size:22px;

text-transform:uppercase;

}

.icono{

font-size:38px;

}

.contador{

display:flex;

gap:40px;

}

.item{

text-align:center;

position:relative;

padding:0 20px;

}

.item:not(:last-child)::after{

content:"";

position:absolute;

right:-20px;

top:5px;

height:65px;

width:1px;

background:rgba(255,255,255,.25);

}

.numero{

font-size:64px;

font-weight:800;

color:#f5c86d;

line-height:1;

text-shadow:0 0 10px rgba(255,220,140,.4);

}

.texto{

margin-top:8px;

font-size:14px;

letter-spacing:2px;

font-weight:600;

color:white;

}

@media(max-width:900px){

.barra{

padding:25px;

gap:25px;

}

.titulo{

width:100%;

justify-content:center;

}

.numero{

font-size:46px;

}

.item{

padding:0 12px;

}

.contador{

gap:15px;

}

}

</style>

</head>

<body>

<div class="barra">

<div class="titulo">

<div class="icono">⏱</div>

<div>

FALTAN PARA EL<br>

CONGRESO

</div>

</div>

<div class="contador">

<div class="item">

<div class="numero" id="dias">00</div>

<div class="texto">DÍAS</div>

</div>

<div class="item">

<div class="numero" id="horas">00</div>

<div class="texto">HORAS</div>

</div>

<div class="item">

<div class="numero" id="minutos">00</div>

<div class="texto">MINUTOS</div>

</div>

<div class="item">

<div class="numero" id="segundos">00</div>

<div class="texto">SEGUNDOS</div>

</div>

</div>

</div>

<script>

</script>

</body>
</html>
