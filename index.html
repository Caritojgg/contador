<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:transparent;
    font-family:'Montserrat',sans-serif;
}

.countdown{

    width:100%;
    background:transparent;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:10px 5px;

}

.countdown-container{

    width:100%;
    max-width:900px;

    display:flex;
    justify-content:space-evenly;
    align-items:center;

}

.item{

    flex:1;
    text-align:center;
    position:relative;
    padding:5px 10px;

}

.item:not(:last-child)::after{

    content:"";

    position:absolute;

    right:0;

    top:10%;

    width:1px;

    height:80%;

    background:rgba(255,255,255,.35);

}

.number{

    font-size:60px;
    font-weight:800;
    color:#D9A441;
    line-height:1;

    text-shadow:
    0 0 6px rgba(255,215,120,.25);

    transition:.3s;

}

.label{

    margin-top:8px;

    color:#FFFFFF;

    font-size:15px;

    font-weight:600;

    letter-spacing:2px;

}

/*************** TABLET ***************/

@media(max-width:992px){

.number{

font-size:46px;

}

.label{

font-size:13px;

}

}

/*************** CELULAR ***************/

@media(max-width:640px){

.countdown{

padding:5px;

}

.number{

font-size:34px;

}

.label{

font-size:11px;

letter-spacing:1px;

}

.item{

padding:4px;

}

}

</style>

</head>

<body>

<section class="countdown">

<div class="countdown-container">

<div class="item">

<div id="dias" class="number">00</div>

<div class="label">DÍAS</div>

</div>

<div class="item">

<div id="horas" class="number">00</div>

<div class="label">HORAS</div>

</div>

<div class="item">

<div id="minutos" class="number">00</div>

<div class="label">MINUTOS</div>

</div>

<div class="item">

<div id="segundos" class="number">00</div>

<div class="label">SEGUNDOS</div>

</div>

</div>

</section>

<script>

const fechaEvento = new Date("2026-08-12T08:30:00").getTime();

function actualizarContador(){

const ahora = new Date().getTime();

const diferencia = fechaEvento - ahora;

if(diferencia <= 0){

document.getElementById("dias").textContent="00";
document.getElementById("horas").textContent="00";
document.getElementById("minutos").textContent="00";
document.getElementById("segundos").textContent="00";

return;

}

const dias=Math.floor(diferencia/(1000*60*60*24));

const horas=Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));

const minutos=Math.floor((diferencia%(1000*60*60))/(1000*60));

const segundos=Math.floor((diferencia%(1000*60))/1000);

document.getElementById("dias").textContent=String(dias).padStart(2,"0");

document.getElementById("horas").textContent=String(horas).padStart(2,"0");

document.getElementById("minutos").textContent=String(minutos).padStart(2,"0");

document.getElementById("segundos").textContent=String(segundos).padStart(2,"0");

}

actualizarContador();

setInterval(actualizarContador,1000);

</script>

</body>
</html>
