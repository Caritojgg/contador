<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contador | V Congreso Internacional de Flagrancia</title>

    <meta name="description" content="Cuenta regresiva para el V Congreso Internacional de Flagrancia">

    <!-- Tipografía -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Hoja de estilos -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

<section class="countdown">

    <div class="countdown-container">

        <div class="countdown-header">

            <span class="subtitle">
                V Congreso Internacional de Flagrancia
            </span>

            <h2>
                Faltan
            </h2>

        </div>

        <div class="countdown-grid">

            <!-- Días -->

            <div class="card">

                <div id="dias" class="number">
                    00
                </div>

                <div class="label">
                    DÍAS
                </div>

            </div>

            <!-- Horas -->

            <div class="card">

                <div id="horas" class="number">
                    00
                </div>

                <div class="label">
                    HORAS
                </div>

            </div>

            <!-- Minutos -->

            <div class="card">

                <div id="minutos" class="number">
                    00
                </div>

                <div class="label">
                    MINUTOS
                </div>

            </div>

            <!-- Segundos -->

            <div class="card">

                <div id="segundos" class="number">
                    00
                </div>

                <div class="label">
                    SEGUNDOS
                </div>

            </div>

        </div>

        <div class="countdown-footer">

            <span>
                12 • 13 • 14 de agosto de 2026
            </span>

        </div>

    </div>

</section>

<script src="script.js"></script>

</body>

</html>
